<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | Ses Garites</title>
<meta name="description" content="Enquire about a stay or event at Ses Garites, a 16th-century Catalan masia in Pals, Costa Brava.">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Cinzel:wght@400;500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2Y84TF9HT3"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-2Y84TF9HT3');
</script>

<style>
  [hidden] {
  display: none !important;
  }

/* Invalid fields */
.sg-field input:invalid,
.sg-field select:invalid,
.sg-field textarea:invalid {
  border-color: #b35b5b;
}

/* Only show after user interaction */
.sg-field input:focus:invalid,
.sg-field select:focus:invalid,
.sg-field textarea:focus:invalid {
  box-shadow: 0 0 0 3px rgba(179, 91, 91, 0.12);
}

/* Valid fields */
.sg-field input:valid,
.sg-field textarea:valid {
  border-color: var(--stone-light);
}
  
  :root {
    --stone: #c8b89a;
    --stone-light: #e8ddd0;
    --stone-dark: #8a7560;
    --parchment: #f5f0e8;
    --ink: #2a2118;
    --ink-soft: #4a3f32;
    --gold: #b8965a;
    --gold-light: #d4b278;
    --cream: #faf7f2;
    --white: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'EB Garamond', Georgia, serif;
    background: var(--parchment);
    color: var(--ink);
  }

  .contact-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 5rem 1.5rem 6rem;
  }

  .back-link {
    font-family: 'Cinzel', serif;
    font-size: 0.65rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--stone-dark);
    text-decoration: none;
    align-self: flex-start;
    max-width: 640px;
    width: 100%;
    margin: 0 auto 2.5rem;
    transition: color 0.3s;
  }
  .back-link::before { content: '← '; }
  .back-link:hover { color: var(--gold); }

  .contact-intro {
    text-align: center;
    max-width: 560px;
    margin-bottom: 3rem;
  }

  .contact-eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 0.65rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--gold);
    display: block;
    margin-bottom: 1rem;
  }

  .contact-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.4rem, 5vw, 3.2rem);
    font-weight: 300;
    color: var(--ink);
    line-height: 1.15;
    margin-bottom: 1.2rem;
  }
  .contact-title em { font-style: italic; color: var(--stone-dark); }

  .contact-sub {
    font-size: 1.1rem;
    line-height: 1.75;
    color: var(--ink-soft);
  }

  .ornament {
    text-align: center;
    color: var(--gold);
    font-size: 0.8rem;
    letter-spacing: 1rem;
    margin-bottom: 2.5rem;
  }

  /* CARD */
  .sg-contact {
    width: 100%;
    max-width: 640px;
    background: var(--white);
    border: 1px solid rgba(200,184,154,0.35);
    box-shadow: 0 30px 80px rgba(42,33,24,0.08);
    padding: 3rem clamp(1.5rem, 5vw, 3.5rem);
  }

  .sg-field-row {
    display: flex;
    gap: 1.25rem;
  }
  .sg-field-row .sg-field { flex: 1; }

  .sg-field {
    margin-bottom: 1.4rem;
    display: flex;
    flex-direction: column;
  }

  .sg-field label {
    font-family: 'Cinzel', serif;
    font-size: 0.62rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--stone-dark);
    margin-bottom: 0.55rem;
  }

  .sg-optional {
    text-transform: none;
    letter-spacing: 0;
    font-family: 'EB Garamond', serif;
    font-style: italic;
    color: var(--stone);
  }

  .sg-field input,
  .sg-field select,
  .sg-field textarea {
    font-family: 'EB Garamond', serif;
    font-size: 1.05rem;
    padding: 0.85rem 1rem;
    border: 1px solid var(--stone-light);
    background: var(--cream);
    color: var(--ink);
    outline: none;
    transition: border-color 0.3s, background 0.3s;
  }
  .sg-field input::placeholder,
  .sg-field textarea::placeholder { color: var(--stone); }

  .sg-field input:focus,
  .sg-field select:focus,
  .sg-field textarea:focus {
    border-color: var(--gold);
    background: var(--white);
  }

  .sg-field select { appearance: none; cursor: pointer; }

  .sg-field textarea { resize: vertical; min-height: 120px; }

  .sg-submit {
    width: 100%;
    margin-top: 0.75rem;
    padding: 1.05rem 2rem;
    font-family: 'Cinzel', serif;
    font-size: 0.75rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--white);
    background: var(--ink);
    border: none;
    cursor: pointer;
    transition: background 0.3s;
  }
  .sg-submit:hover { background: var(--gold); }
  .sg-submit:disabled {
    opacity: 0.55;
    cursor: wait;
  }
#status {
  margin-top: 1.5rem;
  min-height: 1.5rem;
  text-align: center;
  font-family: 'EB Garamond', serif;
  font-style: italic;
  color: var(--stone-dark);
  opacity: 1;
  transition: opacity 0.3s ease;
}

  @media (max-width: 560px) {
    .sg-field-row { flex-direction: column; gap: 0; }
    .contact-page { padding: 3.5rem 1.25rem 4rem; }
  }
</style>
</head>
<body>

<div class="contact-page">

  <a href="/index.html" class="back-link">Ses Garites</a>

  <div class="contact-intro">
    <span class="contact-eyebrow">Reserve the Estate</span>
    <h1 class="contact-title">Tell Us About<br><em>Your Plans</em></h1>
    <p class="contact-sub">Whether you're planning a stay or an event, share a few details below and we'll write back within two days with availability and pricing.</p>
  </div>

  <div class="ornament">&nbsp; &nbsp;</div>

  <section class="sg-contact" id="sg-form">
    <form class="sg-contact__form" id="contactForm" action="https://formspree.io/f/xeeydgba" method="POST">

      <div class="sg-field-row">
        <div class="sg-field">
          <label for="sg-name">May we have your name?</label>
          <input type="text" id="sg-name" name="name" required>
        </div>
        <div class="sg-field">
          <label for="sg-email">Email</label>
          <input type="email" id="sg-email" name="email" required>
        </div>
      </div>

      <div class="sg-field-row">
        <div class="sg-field">
          <label for="sg-checkin">Check-in</label>
          <input type="date" id="sg-checkin" name="checkin_date">
        </div>
        <div class="sg-field">
          <label for="sg-checkout">Check-out</label>
          <input type="date" id="sg-checkout" name="checkout_date">
        </div>
      </div>

      <div class="sg-field">
        <label for="sg-guests">Number of guests</label>
        <input type="number" id="sg-guests" name="guest_count" min="1" placeholder="e.g. 8, or 80 for an event">
      </div>

      <div class="sg-field">
        <label for="sg-message">Tell us about your plans</label>
        <textarea id="sg-message" name="message" rows="4" required placeholder="Tell us a bit about your stay or the occasion you're planning..."></textarea>
      </div>

      <div class="sg-field">
        <label for="sg-source">How did you find Ses Garites? <span class="sg-optional">(optional)</span></label>
        <select id="sg-source" name="how_did_you_find_us">
          <option value="" selected disabled>Choose one...</option>
          <option value="Google / web search">Google or web search</option>
          <option value="Instagram">Instagram</option>
          <option value="Booking Platform">Airbnb, Booking.com, Expedia etc.</option>
          <option value="Wedding planner or vendor referral">Wedding planner or vendor referral</option>
          <option value="Friend or family recommendation">Friend or family recommendation</option>
          <option value="Other">Other (Enter Referral Code if you have one)</option>
        </select>
      </div>

      <div class="sg-field sg-field--other" id="sg-other-wrap" hidden>
        <label for="sg-other">Please specify</label>
        <input type="text" id="sg-other" name="how_did_you_find_us_other">
      </div>

      <!-- honeypot field to cut down on spam; Formspree ignores real submissions with this left blank -->
      <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">

      <button id="submitBtn" type="submit" class="sg-submit">Send Inquiry</button>
    </form>
    <p id="status"></p>
  </section>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const form = document.getElementById("contactForm");
  const status = document.getElementById("status");
  const submitBtn = document.getElementById("submitBtn");

  const source = document.getElementById("sg-source");
  const otherWrap = document.getElementById("sg-other-wrap");

  // Hide "Please specify"
 // Ensure it starts hidden
   otherWrap.hidden = true;
  
  source.addEventListener("change", () => {
    otherWrap.hidden = source.value !== "Other";
  });

  form.addEventListener("submit", async (event) => {

    event.preventDefault();

    // Native browser validation
    if (!form.reportValidity()) {
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Sending…";

    status.textContent = "";

    try {

      const response = await fetch(form.action, {
        method: "POST",
        body: new FormData(form),
        headers: {
          "Accept": "application/json"
        }
      });

      if (response.ok) {

        status.textContent =
          "Thank you. Your inquiry has been received.";

        form.reset();

        otherWrap.style.display = "none";

        submitBtn.textContent = "Inquiry Sent";

        setTimeout(() => {
          window.location.href = "/";
        }, 2500);

      } else {

        submitBtn.disabled = false;
        submitBtn.textContent = "Send Inquiry";

        status.textContent =
          "We couldn't send your inquiry. Please try again.";

      }

    } catch (err) {

      console.error(err);

      submitBtn.disabled = false;
      submitBtn.textContent = "Send Inquiry";

      status.textContent =
        "Network error. Please try again.";

    }

  });

});
</script>

</body>
</html>
