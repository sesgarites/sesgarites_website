name: Generate Gallery Manifests

# Runs every time you push to main. Scans every folder inside /images
# and writes a manifest.json into each one listing its image files,
# so the gallery page can "auto-detect" what's in the folder without
# needing server-side directory listing (which GitHub Pages doesn't support).

on:
  push:
    branches: [ main ]
    paths:
      - 'images/**'
  workflow_dispatch: {}   # lets you run it manually from the Actions tab too

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate manifest.json for each image folder
        run: |
          set -e
          # Adjust this if your images live somewhere other than /images
          ROOT="images"

          if [ ! -d "$ROOT" ]; then
            echo "No '$ROOT' directory found - nothing to do."
            exit 0
          fi

          # Find every directory under images/ (including images/ itself)
          find "$ROOT" -type d | while read -r dir; do
            # Build a JSON array of image filenames in this folder (not subfolders)
            manifest="$dir/manifest.json"
            files=$(find "$dir" -maxdepth 1 -type f \
              \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \
                 -o -iname '*.gif' -o -iname '*.webp' -o -iname '*.avif' \) \
              -printf '%f\n' | sort)

            if [ -z "$files" ]; then
              # Empty folder (or only subfolders) - write an empty list
              echo '{"images": []}' > "$manifest"
            else
              json_array=$(echo "$files" | awk '{printf "%s\"%s\"", sep, $0; sep=","}')
              echo "{\"images\": [${json_array}]}" > "$manifest"
            fi

            echo "Wrote $manifest"
          done

      - name: Commit manifests if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/**/manifest.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No manifest changes."
          else
            git commit -m "Auto-generate gallery manifests [skip ci]"
            git push
          fi
