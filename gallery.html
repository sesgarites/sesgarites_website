<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Gallery</title>
<style>
  :root {
    --bg: #111315;
    --panel: #1b1e21;
    --accent: #4da3ff;
    --text: #e8e8e8;
    --text-dim: #9aa0a6;
    --thumb-size: 92px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }

  .gallery-app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* Top bar */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid #2a2d30;
    flex-shrink: 0;
    gap: 12px;
  }

  .toolbar h1 {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-dim);
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .toolbar-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .toolbar button {
    background: #2a2d30;
    color: var(--text);
    border: none;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .toolbar button:hover { background: #34383c; }

  .counter {
    font-size: 13px;
    color: var(--text-dim);
    min-width: 60px;
    text-align: center;
  }

  /* Main layout: stage + thumbnail strip, orientation controlled by class on root */
  .stage-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .gallery-app.thumbs-above .stage-wrap { flex-direction: column; }
  .gallery-app.thumbs-below .stage-wrap { flex-direction: column; }
  .gallery-app.thumbs-above .thumb-strip { order: -1; }
  .gallery-app.thumbs-below .thumb-strip { order: 1; }

  .stage {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0c0d0e;
    overflow: hidden;
    min-height: 0;
  }

  .stage img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    user-select: none;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .stage img.loaded { opacity: 1; }

  .stage .spinner {
    position: absolute;
    width: 32px;
    height: 32px;
    border: 3px solid #333;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .nav-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.4);
    border: none;
    color: #fff;
    width: 44px;
    height: 64px;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    transition: background 0.15s;
  }
  .nav-arrow:hover { background: rgba(0,0,0,0.7); }
  .nav-arrow.prev { left: 12px; }
  .nav-arrow.next { right: 12px; }
  .nav-arrow:disabled { opacity: 0.25; cursor: default; }

  /* Thumbnail strip */
  .thumb-strip {
    flex-shrink: 0;
    background: var(--panel);
    border-top: 1px solid #2a2d30;
    border-bottom: 1px solid #2a2d30;
    overflow-x: auto;
    overflow-y: hidden;
    white-space: nowrap;
    padding: 10px 12px;
    display: flex;
    gap: 8px;
    scrollbar-width: thin;
  }
  .gallery-app.thumbs-above .thumb-strip { border-top: none; }
  .gallery-app.thumbs-below .thumb-strip { border-bottom: none; }

  .thumb {
    flex-shrink: 0;
    width: var(--thumb-size);
    height: var(--thumb-size);
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    border: 2px solid transparent;
    background: #222;
    position: relative;
  }
  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .thumb.active {
    border-color: var(--accent);
  }
  .thumb:hover:not(.active) {
    border-color: #555;
  }

  .empty-state, .error-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    color: var(--text-dim);
    text-align: center;
    padding: 24px;
  }
  .error-state strong { color: #ff6b6b; }

  kbd {
    background: #2a2d30;
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 11px;
  }
</style>
</head>
<body>

<div class="gallery-app thumbs-below" id="app">
  <div class="toolbar">
    <h1 id="folderLabel">Loading gallery…</h1>
    <div class="toolbar-controls">
      <span class="counter" id="counter"></span>
      <button id="toggleThumbsBtn" title="Move thumbnail strip">⇕ Thumbs: Below</button>
    </div>
  </div>

  <div class="stage-wrap">
    <div class="stage" id="stage">
      <div class="spinner" id="spinner" style="display:none;"></div>
      <button class="nav-arrow prev" id="prevBtn" aria-label="Previous image">‹</button>
      <img id="mainImage" alt="">
      <button class="nav-arrow next" id="nextBtn" aria-label="Next image">›</button>
    </div>
    <div class="thumb-strip" id="thumbStrip"></div>
  </div>
</div>

<script>
(function () {
  const app = document.getElementById('app');
  const stage = document.getElementById('stage');
  const mainImage = document.getElementById('mainImage');
  const spinner = document.getElementById('spinner');
  const thumbStrip = document.getElementById('thumbStrip');
  const folderLabel = document.getElementById('folderLabel');
  const counter = document.getElementById('counter');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const toggleThumbsBtn = document.getElementById('toggleThumbsBtn');

  // ---- Read ?folder=... from the URL ----
  const params = new URLSearchParams(window.location.search);
  const folder = params.get('folder');

  let images = [];
  let currentIndex = 0;
  let thumbsPosition = localStorage.getItem('gallery-thumbs-position') || 'below';

  function applyThumbsPosition() {
    app.classList.remove('thumbs-above', 'thumbs-below');
    app.classList.add(thumbsPosition === 'above' ? 'thumbs-above' : 'thumbs-below');
    toggleThumbsBtn.textContent = '⇕ Thumbs: ' + (thumbsPosition === 'above' ? 'Above' : 'Below');
  }

  toggleThumbsBtn.addEventListener('click', () => {
    thumbsPosition = thumbsPosition === 'above' ? 'below' : 'above';
    localStorage.setItem('gallery-thumbs-position', thumbsPosition);
    applyThumbsPosition();
  });

  function showError(message) {
    stage.innerHTML = `<div class="error-state"><strong>Couldn't load gallery</strong><div>${message}</div></div>`;
    thumbStrip.style.display = 'none';
    prevBtn.style.display = 'none';
    nextBtn.style.display = 'none';
  }

  if (!folder) {
    showError('No folder specified. Link to this page with <code>?folder=your-folder-name</code>.');
    return;
  }

  // Folder is relative to wherever this gallery.html lives, e.g.
  // gallery.html?folder=images/vacation-2024
  const manifestUrl = folder.replace(/\/+$/, '') + '/manifest.json';

  folderLabel.textContent = folder;

  fetch(manifestUrl, { cache: 'no-store' })
    .then(res => {
      if (!res.ok) throw new Error('manifest.json not found (HTTP ' + res.status + ')');
      return res.json();
    })
    .then(data => {
      images = (data.images || []).map(name => folder.replace(/\/+$/, '') + '/' + name);
      if (images.length === 0) {
        showError('This folder has no images yet.');
        return;
      }
      buildThumbnails();
      applyThumbsPosition();
      goToImage(0);
    })
    .catch(err => {
      showError(err.message + '. Make sure the GitHub Action has run and committed a manifest.json into this folder.');
    });

  function buildThumbnails() {
    thumbStrip.innerHTML = '';
    images.forEach((src, i) => {
      const div = document.createElement('div');
      div.className = 'thumb';
      div.dataset.index = i;
      const img = document.createElement('img');
      img.src = src;
      img.loading = 'lazy';
      img.alt = 'Thumbnail ' + (i + 1);
      div.appendChild(img);
      div.addEventListener('click', () => goToImage(i));
      thumbStrip.appendChild(div);
    });
  }

  function goToImage(index) {
    if (index < 0 || index >= images.length) return;
    currentIndex = index;

    // Loading state
    mainImage.classList.remove('loaded');
    spinner.style.display = 'block';

    const loader = new Image();
    loader.onload = () => {
      mainImage.src = loader.src;
      mainImage.alt = 'Image ' + (currentIndex + 1) + ' of ' + images.length;
      spinner.style.display = 'none';
      mainImage.classList.add('loaded');
    };
    loader.onerror = () => {
      spinner.style.display = 'none';
      mainImage.alt = 'Failed to load image';
    };
    loader.src = images[currentIndex];

    counter.textContent = (currentIndex + 1) + ' / ' + images.length;
    prevBtn.disabled = currentIndex === 0;
    nextBtn.disabled = currentIndex === images.length - 1;

    // Update active thumbnail + scroll it into view
    document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
    const activeThumb = thumbStrip.querySelector('[data-index="' + currentIndex + '"]');
    if (activeThumb) {
      activeThumb.classList.add('active');
      activeThumb.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }
  }

  prevBtn.addEventListener('click', () => goToImage(currentIndex - 1));
  nextBtn.addEventListener('click', () => goToImage(currentIndex + 1));

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') goToImage(currentIndex - 1);
    if (e.key === 'ArrowRight') goToImage(currentIndex + 1);
    if (e.key === 'Escape') window.close();
  });
})();
</script>
</body>
</html>
